name: Sync preproduction lockfile

on:
  push:
    branches:
      - feat/preprod-auth-admin-learning-platform
    paths:
      - package.json
      - .github/workflows/sync-preprod-lockfile.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/preprod-auth-admin-learning-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize preproduction lockfile"
          git push origin HEAD:feat/preprod-auth-admin-learning-platform
